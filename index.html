<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forever means forever</title>
    <!-- استدعاء خطوط احترافية من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;600&family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #050000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Montserrat', sans-serif;
        }

        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }
        #start-screen h1 {
            font-size: 2.5rem;
            font-family: 'Tajawal', sans-serif;
            color: #ff3344;
            text-shadow: 0 0 20px rgba(255, 51, 68, 0.5);
            animation: pulse 1.5s infinite alternate;
        }

        #content {
            display: none;
            text-align: center;
            position: relative;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 1.5s ease-in;
        }

        /* عنوان احترافي وسينمائي */
        .header-text {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #ffaaaa, #ff0044, #ffaaaa);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            margin-bottom: 20px;
            margin-top: -40px;
            text-shadow: 0 0 30px rgba(255, 0, 68, 0.3);
            letter-spacing: 2px;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }
        
        /* عداد زجاجي احترافي (Glassmorphism) */
        .counter {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 15px 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(255, 0, 50, 0.15);
            margin-bottom: 50px;
            direction: ltr;
            display: flex;
            gap: 15px;
        }

        .counter span {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 75px;
        }

        .counter span .num {
            font-size: 2.2rem;
            font-weight: 600;
            color: #ff3355;
            text-shadow: 0 0 15px rgba(255, 51, 85, 0.8);
        }

        .counter span .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #cccccc;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .heart-container {
            position: relative;
            width: 380px;
            height: 380px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .heart-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            /* زيادة التباين ليتناسب مع شكل الـ HDR */
            filter: contrast(1.2) brightness(1.1) drop-shadow(0 0 30px rgba(255,0,0,0.4));
        }

        /* تصميم الكلمة لتكون واضحة جداً ومضيئة */
        .roro-word {
            position: absolute;
            font-family: 'Tajawal', sans-serif;
            font-size: 2.8rem;
            color: #ffffff;
            font-weight: 900;
            /* توهج أبيض بقلب أحمر لضمان القراءة على أي خلفية */
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #ff0055,
                0 0 20px #ff0055,
                0 0 40px #ff0055,
                0 0 80px #ff0000;
            pointer-events: none;
            opacity: 0;
            z-index: 10;
            animation: floatUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
            20% { opacity: 1; transform: translate(calc(-50% + var(--tx) * 0.2), calc(-50% + var(--ty) * 0.2)) scale(1.2); }
            80% { opacity: 0.8; }
            100% { opacity: 0; transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.5); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>اضغط هنا للبدء ❤️</h1>
    </div>

    <div id="content">
        <div class="header-text">Forever means forever</div>
        
        <!-- عداد مقسم بشكل احترافي -->
        <div class="counter" id="timer">
            <span><div class="num" id="d">00</div><div class="label">Days</div></span> : 
            <span><div class="num" id="h">00</div><div class="label">Hours</div></span> : 
            <span><div class="num" id="m">00</div><div class="label">Minutes</div></span> : 
            <span><div class="num" id="s">00</div><div class="label">Seconds</div></span>
        </div>
        
        <div class="heart-container" id="heart-box">
            <video src="heart.mp4" autoplay loop muted playsinline class="heart-video"></video>
        </div>
    </div>

    <audio id="bg-audio">
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <script>
        const startScreen = document.getElementById('start-screen');
        const content = document.getElementById('content');
        const audio = document.getElementById('bg-audio');

        const startTime = 120;
        const endTime = 236;

        startScreen.addEventListener('click', () => {
            audio.currentTime = startTime; 
            
            audio.play().then(() => {
                startScreen.style.opacity = '0';
                setTimeout(() => {
                    startScreen.style.display = 'none';
                    content.style.display = 'flex';
                    setTimeout(() => { content.style.opacity = '1'; }, 50);
                    startHeartbeatWords();
                }, 800);
            }).catch((error) => {
                alert("برجاء التأكد من وجود ملف song.mp3 في نفس المجلد.");
            });
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.currentTime >= endTime) {
                audio.currentTime = startTime;
            }
        });

        const startDate = new Date("2025-01-08T00:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            let diff = Math.abs(now - startDate);
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById("d").innerText = days.toString().padStart(2, '0');
            document.getElementById("h").innerText = hours.toString().padStart(2, '0');
            document.getElementById("m").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("s").innerText = seconds.toString().padStart(2, '0');
        }, 1000);

        // الكلمات التي ستخرج مع النبض
        const words = ['رورتي', 'رورو'];

        function startHeartbeatWords() {
            setInterval(() => {
                const heartBox = document.getElementById('heart-box');
                const word = document.createElement('div');
                word.className = 'roro-word';
                
                // اختيار الكلمة
                word.innerText = words[Math.floor(Math.random() * words.length)];
                
                const angle = Math.random() * Math.PI * 2;
                const distance = 140 + Math.random() * 60;
                const tx = Math.cos(angle) * distance + 'px';
                const ty = Math.sin(angle) * distance + 'px';
                
                word.style.setProperty('--tx', tx);
                word.style.setProperty('--ty', ty);
                
                word.style.left = '50%';
                word.style.top = '50%';
                
                heartBox.appendChild(word);
                setTimeout(() => { word.remove(); }, 1200);
            }, 900);
        }
    </script>
</body>
</html>
