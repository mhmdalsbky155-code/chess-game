<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forever means forever</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.5s;
        }
        #start-screen h1 {
            font-size: 2rem;
            color: #ff3333;
            animation: pulse 1s infinite alternate;
        }

        #content {
            display: none;
            text-align: center;
            position: relative;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 1s ease-in;
        }

        .header-text {
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 30px rgba(255, 0, 0, 0.6);
            letter-spacing: 1px;
            margin-bottom: 10px;
            margin-top: -30px;
        }
        
        /* تعديلات العداد ليصبح HDR ومضيء */
        .counter {
            font-size: 1.6rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 
                0 0 10px #ffffff,
                0 0 20px #ff4d4d,
                0 0 30px #ff0000,
                0 0 40px #cc0000,
                0 0 50px #990000;
            margin-bottom: 40px;
            direction: ltr;
            letter-spacing: 2px;
            background: rgba(20, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 50, 50, 0.3);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3) inset, 0 0 20px rgba(255, 0, 0, 0.4);
        }

        .heart-container {
            position: relative;
            width: 350px;
            height: 350px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .heart-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .roro-word {
            position: absolute;
            font-size: 1.8rem;
            color: #ff4d4d;
            font-weight: bold;
            text-shadow: 0 0 10px #fff, 0 0 20px #ff0000;
            pointer-events: none;
            opacity: 0;
            z-index: 10;
            animation: floatUp 1s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(0, 0) scale(0.5); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.5); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>اضغط هنا للبدء ❤️</h1>
    </div>

    <div id="content">
        <div class="header-text">Forever means forever</div>
        <div class="counter" id="timer">Loading...</div>
        
        <div class="heart-container" id="heart-box">
            <video src="heart.mp4" autoplay loop muted playsinline class="heart-video"></video>
        </div>
    </div>

    <audio id="bg-audio">
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <script>
        const startScreen = document.getElementById('start-screen');
        const content = document.getElementById('content');
        const audio = document.getElementById('bg-audio');

        const startTime = 120;
        const endTime = 236;

        startScreen.addEventListener('click', () => {
            audio.currentTime = startTime; 
            
            audio.play().then(() => {
                startScreen.style.opacity = '0';
                setTimeout(() => {
                    startScreen.style.display = 'none';
                    content.style.display = 'flex';
                    setTimeout(() => { content.style.opacity = '1'; }, 50);
                    startHeartbeatWords();
                }, 500);
            }).catch((error) => {
                alert("برجاء التأكد من وجود ملف song.mp3 في نفس المجلد.");
            });
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.currentTime >= endTime) {
                audio.currentTime = startTime;
            }
        });

        const startDate = new Date("2025-01-08T00:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            let diff = now - startDate;
            
            const days = Math.floor(Math.abs(diff) / (1000 * 60 * 60 * 24));
            const hours = Math.floor((Math.abs(diff) % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((Math.abs(diff) % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((Math.abs(diff) % (1000 * 60)) / 1000);
            
            let text = diff < 0 ? 
                `متبقي: ${days} يوم, ${hours} ساعة, ${minutes} دقيقة, ${seconds} ثانية` : 
                `${days} Days : ${hours} Hours : ${minutes} Minutes : ${seconds} Seconds`;
            
            document.getElementById("timer").innerHTML = text;
        }, 1000);

        function startHeartbeatWords() {
            setInterval(() => {
                const heartBox = document.getElementById('heart-box');
                const word = document.createElement('div');
                word.className = 'roro-word';
                word.innerText = 'رورو';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = 120 + Math.random() * 60;
                const tx = Math.cos(angle) * distance + 'px';
                const ty = Math.sin(angle) * distance + 'px';
                
                word.style.setProperty('--tx', tx);
                word.style.setProperty('--ty', ty);
                word.style.left = '45%';
                word.style.top = '45%';
                
                heartBox.appendChild(word);
                setTimeout(() => { word.remove(); }, 1000);
            }, 900);
        }
    </script>
</body>
</html>
